<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet — Configurações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
      <nav>
        <ul>
      <li><a href="pets.html">Pet</a></li>
      <li><a href="usuarios.html">Usuários</a></li>
      <li class="ativo"><a href="configuracoes.html">Configurações</a></li>
      <li><a href="reservas.html">Reservas</a></li>
        </ul>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="perfil.html" class="perfil-link">
          <img src="assets/avatar-veronica.jpg" alt="Foto de Veronica de Carvalho" class="avatar">
          <span>Veronica de Carvalho</span>
        </a>
        <a href="login.html" class="link-sair">Sair</a>
      </header>

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="reservas.html">Home</a> / Configurações
      </nav>

      <main class="conteudo">
        <section class="painel painel-formulario">
          <h2>Configurações</h2>
          <form action="#" method="post" class="form" onsubmit="return false;">
            <label for="valor-diaria">Valor da diária</label>
            <input type="text" id="valor-diaria" name="valor_diaria" value="R$ 10,00">

            <label for="vagas">Vagas disponíveis</label>
            <input type="number" id="vagas" name="vagas" value="3" min="0">

            <div class="form-acoes">
              <a href="reservas.html" class="botao botao-primario">💾 Salvar</a>
              <button type="reset" class="botao botao-outline">↺ Limpar</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
