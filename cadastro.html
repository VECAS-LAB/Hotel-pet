<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet — Criar conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-imagem">
      <img src="assets/banner-placeholder.svg" alt="Foto de pets no Hotel Pet">
    </div>
    <div class="auth-form">
      <h1 class="marca">Hotel Pet</h1>
      <form action="#" method="post" class="form-auth">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" placeholder="E-mail">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha">

        <button type="submit" class="botao botao-primario botao-full">Criar conta</button>

        <a href="login.html" class="link-primario link-centralizado">Já tem conta? Login</a>
      </form>
    </div>
  </div>
</body>
</html>
