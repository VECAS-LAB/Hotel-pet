<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet — Editar Perfil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
      <nav>
        <ul>
      <li><a href="pets.html">Pet</a></li>
      <li><a href="usuarios.html">Usuários</a></li>
      <li><a href="configuracoes.html">Configurações</a></li>
      <li class="ativo"><a href="reservas.html">Reservas</a></li>
        </ul>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="perfil.html" class="perfil-link">
          <img src="assets/avatar-placeholder.svg" alt="Foto de perfil" class="avatar">
          <span>João da Silva</span>
        </a>
      </header>

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="reservas.html">Home</a> / Editar Perfil
      </nav>

      <main class="conteudo">
        <section class="painel painel-formulario painel-com-imagem">
          <h2>Editar Perfil</h2>
          <form action="#" method="post" class="form form-com-imagem">
            <div class="form-campos">
              <label for="email">E-mail *</label>
              <input type="email" id="email" name="email" value="joaodasilva@pet.com" required>

              <label for="nome">Nome *</label>
              <input type="text" id="nome" name="nome" value="João" required>

              <label for="sobrenome">Sobrenome</label>
              <input type="text" id="sobrenome" name="sobrenome" value="da Silva">

              <label for="telefone">Telefone *</label>
              <input type="tel" id="telefone" name="telefone" value="+55 (73) 99876-8943" required>

              <label for="funcao">Função</label>
              <select id="funcao" name="funcao" disabled>
                <option value="gerente" selected>Gerente</option>
              </select>
            </div>

            <div class="form-imagem">
              <label>Foto</label>
              <div class="imagem-preview imagem-preview-grande">
                <img src="assets/avatar-placeholder.svg" alt="Foto de João da Silva">
              </div>
            </div>

            <div class="form-acoes">
              <button type="submit" class="botao botao-primario">💾 Salvar</button>
              <button type="reset" class="botao botao-outline">↺ Limpar</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
