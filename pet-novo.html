<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet — Novo Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
      <nav>
        <ul>
      <li class="ativo"><a href="pets.html">Pet</a></li>
      <li><a href="usuarios.html">Usuários</a></li>
      <li><a href="configuracoes.html">Configurações</a></li>
      <li><a href="reservas.html">Reservas</a></li>
        </ul>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="perfil.html" class="perfil-link">
          <img src="assets/avatar-veronica.jpg" alt="Foto de Veronica de Carvalho" class="avatar">
          <span>Veronica de Carvalho</span>
        </a>
        <a href="login.html" class="link-sair">Sair</a>
      </header>

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="reservas.html">Home</a> / <a href="pets.html">Pet</a> / Novo Pet
      </nav>

      <main class="conteudo">
        <section class="painel painel-formulario painel-com-imagem">
          <h2>Novo Pet</h2>
          <form action="#" method="post" class="form form-com-imagem" onsubmit="return false;">
            <div class="form-campos">
              <label for="proprietario">Proprietário *</label>
              <input type="text" id="proprietario" name="proprietario" required placeholder="Ex: Geralt">

              <label for="nome">Nome *</label>
              <input type="text" id="nome" name="nome" required>

              <label for="tipo">Tipo *</label>
              <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="cachorro">Cachorro</option>
                <option value="gato">Gato</option>
                <option value="outro">Outro</option>
              </select>

              <label for="raca">Raça *</label>
              <input type="text" id="raca" name="raca" required>

              <label for="tamanho">Tamanho *</label>
              <select id="tamanho" name="tamanho" required>
                <option value="">Selecione</option>
                <option value="pequeno">Pequeno</option>
                <option value="medio">Médio</option>
                <option value="grande">Grande</option>
              </select>
            </div>

            <div class="form-imagem">
              <label>Imagem</label>
              <div class="imagem-preview imagem-preview-grande">
                <img src="assets/img-placeholder.svg" alt="Foto do pet">
              </div>
            </div>

            <div class="form-acoes">
              <a href="pets.html" class="botao botao-primario">💾 Salvar</a>
              <button type="reset" class="botao botao-outline">↺ Limpar</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
