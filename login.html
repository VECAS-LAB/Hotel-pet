<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-imagem">
      <img src="assets/banner-placeholder.svg" alt="Foto de pets no Hotel Pet">
    </div>
    <div class="auth-form">
      <h1 class="marca">Hotel Pet</h1>
      <form action="#" method="post" class="form-auth">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" placeholder="E-mail">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha">

        <div class="linha-opcoes">
          <label class="checkbox">
            <input type="checkbox" checked> Mantenha-me conectado
          </label>
          <a href="#" class="link-secundario">Esqueci a senha</a>
        </div>

        <button type="submit" class="botao botao-primario botao-full">Enviar</button>

        <div class="separador"><span>ou</span></div>

        <div class="login-social">
          <a href="#" aria-label="Entrar com Facebook">
            <img src="assets/icon-facebook.svg" alt="Facebook">
          </a>
          <a href="#" aria-label="Entrar com Twitter">
            <img src="assets/icon-twitter.svg" alt="Twitter">
          </a>
          <a href="#" aria-label="Entrar com Google">
            <img src="assets/icon-google.svg" alt="Google">
          </a>
        </div>

        <a href="cadastro.html" class="link-primario link-centralizado">Criar uma conta</a>
      </form>
    </div>
  </div>
</body>
</html>
