<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet — Pets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
      <nav>
        <ul>
      <li class="ativo"><a href="pets.html">Pet</a></li>
      <li><a href="usuarios.html">Usuários</a></li>
      <li><a href="configuracoes.html">Configurações</a></li>
      <li><a href="reservas.html">Reservas</a></li>
        </ul>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="perfil.html" class="perfil-link">
          <img src="assets/avatar-placeholder.png" alt="Foto de perfil" class="avatar">
          <span>João da Silva</span>
        </a>
      </header>

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="reservas.html">Home</a> / Pets
      </nav>

      <main class="conteudo">
        <section class="painel">
          <div class="painel-cabecalho">
            <h2>Pets</h2>
          </div>

          <div class="acoes">
            <a href="pet-novo.html" class="botao botao-outline">+ Novo Pet</a>
          </div>

          <form action="#" method="get" class="filtros">
            <div class="campo">
              <label for="f-id">Id</label>
              <input type="text" id="f-id" name="id">
            </div>
            <div class="campo">
              <label for="f-raca">Raça</label>
              <input type="text" id="f-raca" name="raca">
            </div>
            <div class="campo">
              <label for="f-nome">Nome</label>
              <input type="text" id="f-nome" name="nome">
            </div>
            <div class="campo">
              <label for="f-tamanho">Tamanho</label>
              <input type="text" id="f-tamanho" name="tamanho">
            </div>

            <div class="filtros-acoes">
              <button type="submit" class="botao botao-primario">Pesquisar</button>
              <button type="reset" class="botao botao-outline">Limpar</button>
            </div>
          </form>

          <table class="tabela">
            <thead>
              <tr>
                <th><input type="checkbox"></th>
                <th>Id</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Raça</th>
                <th>Tamanho</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input type="checkbox"></td>
                <td>12349984501</td>
                <td>Max</td>
                <td>Cachorro</td>
                <td>Pastor Alemão</td>
                <td>Grande</td>
                <td class="tabela-acoes">
                  <a href="pet-editar.html">Editar</a>
                  <a href="pet-ver.html">Visualizar</a>
                </td>
              </tr>
              <tr>
                <td><input type="checkbox"></td>
                <td>12349984502</td>
                <td>Ginger</td>
                <td>Gato</td>
                <td>Não definida</td>
                <td>Pequeno</td>
                <td class="tabela-acoes">
                  <a href="pet-editar.html">Editar</a>
                  <a href="pet-ver.html">Visualizar</a>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
