<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar reserva</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <a href="index.html">Hotel Pet</a>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="pets.html">Pet</a>
                </li>

                <li>
                    <a href="usuarios.html">Usuários</a>
                </li>

                <li>
                    <a href="configuracoes.html">Configurações</a>
                </li>

                <li class="ativo">
                    <a href="reservas.html">Reservas</a>
                </li>
            </ul>
        </nav>

    </aside>

    <main class="main">

        <div class="topbar">

            <a href="perfil.html" class="perfil-link">
                <img src="assets/avatar-veronica.jpg"
                     alt="Foto de Veronica de Carvalho"
                     class="avatar">
                <span>Veronica de Carvalho</span>
            </a>

            <a href="index.html" class="link-sair">Sair</a>

        </div>
        <div class="breadcrumb">
            Home / reservas / editar reserva
        </div>


        <section class="conteudo">

            <h1>Editar reserva</h1>


            <form>

                <div class="campo">
                    <label for="proprietario">
                        Proprietário *
                    </label>

                    <input
                        type="text"
                        id="proprietario"
                        value="Geralt"
                    >
                </div>


                <div class="campo">
                    <label for="pet">
                        Pet *
                    </label>

                    <input
                        type="text"
                        id="pet"
                        value="Carpeado"
                    >
                </div>


                <div class="campo">

                    <label>
                        Período *
                    </label>

                    <div class="periodo">

                        <input
                            type="date"
                            value="2026-08-25"
                        >

                        <input
                            type="date"
                            value="2026-08-30"
                        >

                    </div>

                </div>


                <div class="campo">

                    <label for="notas">
                        Notas
                    </label>

                    <textarea id="notas">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</textarea>

                </div>


                <div class="campo">

                    <label for="status">
                        Status*
                    </label>

                    <select id="status">

                        <option value="reservada">
                            Reservada
                        </option>

                        <option value="em_progresso">
                            Em progresso
                        </option>

                        <option value="cancelado">
                            Cancelado
                        </option>

                        <option value="finalizado" selected>
                            Finalizado
                        </option>

                    </select>

                </div>


                <div class="total">

                    Total das diárias:
                    <strong>R$ 50,00</strong>

                </div>


                <!-- Parte específica da reserva finalizada -->

                <div class="documentos">

                    <button
                        type="button"
                        class="adicionar-nota"
                    >
                        Adicionar nota Fiscal
                    </button>


                    <a href="#" class="recibo">
                        📎 recibo.pdf
                    </a>

                </div>


             <div class="acoes">

    <a href="reservas.html" class="botao botao-primario">
        Salvar
    </a>

    <button type="reset" class="botao botao-outline">
        Limpar
    </button>

</div>

            </form>

        </section>

    </main>

    <div>

</body>

</html>
